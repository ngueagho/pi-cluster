---

- name: Set platform and architecture facts
  ansible.builtin.set_fact:
    k8s_platform: "{{ ansible_facts['system'] | lower }}"
    k8s_arch: >-
      {{
        'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else
        'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else
        ansible_facts['architecture']
      }}
  delegate_to: localhost
  become: false

- name: Check if Cilium CLI is installed
  ansible.builtin.stat:
    path: "{{ cilium_cli_bin_path }}"
  register: cilium_cli_stat
  delegate_to: localhost
  become: false

- name: Get installed Cilium CLI version
  ansible.builtin.command: "{{ cilium_cli_bin_path }} version --client"
  register: cilium_cli_existing_version
  changed_when: false
  failed_when: false
  when: cilium_cli_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Download and install Cilium CLI
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-{{ k8s_platform }}-{{ k8s_arch }}.tar.gz"
    dest: "/tmp/cilium-cli.tar.gz"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: >
    not cilium_cli_stat.stat.exists
    or (cilium_cli_version not in (cilium_cli_existing_version.stdout | default('')))

- name: Extract Cilium CLI binary
  ansible.builtin.unarchive:
    src: /tmp/cilium-cli.tar.gz
    dest: /tmp
    remote_src: false
  delegate_to: localhost
  become: false
  when: >
    not cilium_cli_stat.stat.exists
    or (cilium_cli_version not in (cilium_cli_existing_version.stdout | default('')))

- name: Install Cilium CLI binary
  ansible.builtin.copy:
    src: /tmp/cilium
    dest: "{{ cilium_cli_bin_path }}"
    mode: "0755"
    remote_src: false
  become: true
  delegate_to: localhost
  when: >
    not cilium_cli_stat.stat.exists
    or (cilium_cli_version not in (cilium_cli_existing_version.stdout | default('')))
