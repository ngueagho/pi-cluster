---

- name: Create GatewayClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: "{{ gateway_class_name }}"
      spec:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
  become: false
  delegate_to: localhost

- name: Create public Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: public-gateway
        namespace: "{{ envoy_gateway_namespace }}"
      spec:
        gatewayClassName: "{{ gateway_class_name }}"
        listeners:
          - name: http
            protocol: HTTP
            port: 80
          - name: https
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: "{{ envoy_gateway_namespace }}"
  become: false
  delegate_to: localhost
