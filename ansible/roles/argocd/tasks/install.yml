---

- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  become: false
  delegate_to: localhost

- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  become: false
  delegate_to: localhost

- name: Create ArgoCD admin secret from Vault password
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
        namespace: "{{ argocd_namespace }}"
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd
      data:
        admin.password: "{{ argocd_admin_password_hash | b64encode }}"
        admin.passwordMtime: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%SZ') | b64encode }}"
  become: false
  delegate_to: localhost
  when: argocd_admin_password_hash | length > 0
  no_log: true

- name: Deploy ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values: "{{ lookup('template', 'argocd-values.yml.j2') | from_yaml }}"
    wait: true
    wait_condition:
      type: Complete
    timeout: "10m0s"
  become: false
  delegate_to: localhost

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  become: false
  delegate_to: localhost
