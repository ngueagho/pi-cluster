---

- name: Apply ArgoCD RBAC configmap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
        namespace: "{{ argocd_namespace }}"
        labels:
          app.kubernetes.io/name: argocd-rbac-cm
          app.kubernetes.io/part-of: argocd
      data:
        policy.default: role:readonly
        policy.csv: "{{ argocd_rbac_policy }}"
  become: false
  delegate_to: localhost

- name: Bootstrap platform AppProject
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../kubernetes/argocd/project-platform.yaml"
  become: false
  delegate_to: localhost
  when: argocd_bootstrap_repo_url | length > 0

- name: Bootstrap root Application (App of Apps — platform)
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../kubernetes/argocd/root-app.yaml"
  become: false
  delegate_to: localhost
  when: argocd_bootstrap_repo_url | length > 0
