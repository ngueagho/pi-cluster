---

- name: Add Longhorn Helm repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
  become: false
  delegate_to: localhost

- name: Install Longhorn via Helm
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: "{{ longhorn_namespace }}"
    create_namespace: true
    values:
      defaultSettings:
        defaultDataPath: "{{ longhorn_data_path }}"
        defaultReplicaCount: "{{ longhorn_default_replicas }}"
        backupTarget: "{{ longhorn_backup_target }}"
        backupTargetCredentialSecret: "{{ longhorn_backup_credential_secret if longhorn_backup_target else '' }}"
      persistence:
        defaultClass: "{{ longhorn_storage_class_default }}"
        defaultClassReplicaCount: "{{ longhorn_default_replicas }}"
    wait: true
    timeout: "10m0s"
  become: false
  delegate_to: localhost
  retries: 3
  delay: 15

- name: Wait for Longhorn manager to be ready
  kubernetes.core.k8s_info:
    kind: DaemonSet
    name: longhorn-manager
    namespace: "{{ longhorn_namespace }}"
    wait: true
    wait_condition:
      type: Available
    wait_timeout: 300
  become: false
  delegate_to: localhost
