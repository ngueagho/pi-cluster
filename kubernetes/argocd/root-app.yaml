---
# Root Application — App of Apps pattern.
# ArgoCD auto-discovers all Application manifests under kubernetes/argocd/platform/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/ngueagho/pi-cluster.git
    targetRevision: roberto
    path: kubernetes/argocd/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
